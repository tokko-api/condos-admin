server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework: ${SPRING_LOG_LEVEL:WARN}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    com.condos: ${APP_LOG_LEVEL:DEBUG}

board:
  api:
    base-url: ${BOARD_API_URL:http://board-api:8080/condos/api/board}

user:
  api:
    base-url: ${USER_API_URL:http://user-api:8080/condos/api/user}

mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}
  mail-from: ${MAIL_FROM:noreply@lokaly.site}

app:
  errors:
    verbose: ${ERRORS_VERBOSE:false}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: condos-auth
      expires-minutes: ${JWT_EXPIRES_MINUTES:240}
